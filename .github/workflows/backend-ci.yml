name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install backend dependencies
        run: cd backend && npm install

      - name: Test backend starts
        run: cd backend && node server.js &
      
      - name: Server waiting
        run: sleep 3
      - name: api testing
        run: curl http://localhost:4000/users