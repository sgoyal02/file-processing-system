name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm install
      
      - name: Build backend
        run: npm run build
      
      - name: Create env file
        run: |
          echo "PORT=4000" >> .env
          echo "DB_URL=postgresql://test:test@localhost:5432/testdb" >> .env

      - name: Test backend starts
        run: npm run dev &
      
      - name: Server waiting
        run: sleep 3
      - name: api testing
        run: curl http://localhost:4000